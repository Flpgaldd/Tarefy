name: tarefy

x-app-service: &app-service
  image: tarefy-app:local
  env_file:
    - .env.docker
  # 🎯 ALTERADO: PHP, fila e agendador compartilham o horário de Brasília.
  environment:
    TZ: "America/Sao_Paulo"
  volumes:
    - tarefy-resources:/var/www/html/resources
    - tarefy-storage:/var/www/html/storage
    - tarefy-avatars:/var/www/html/public/avatars
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped

services:
  app:
    <<: *app-service
    build:
      context: .
      target: app
    environment:
      # 🎯 ALTERADO: este bloco substitui o `environment` herdado, portanto o
      # fuso também precisa ser declarado diretamente no serviço principal.
      TZ: "America/Sao_Paulo"
      RUN_MIGRATIONS: "true"
      VITE_DEV_SERVER_URL: "http://localhost:5173"
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/tarefy-ready"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  web:
    image: tarefy-web:local
    build:
      context: .
      target: web
    ports:
      - "8080:80"
    # 🎯 ALTERADO: os logs do servidor web seguem o mesmo fuso da aplicação.
    environment:
      TZ: "America/Sao_Paulo"
    volumes:
      - tarefy-avatars:/var/www/html/public/avatars:ro
    depends_on:
      app:
        condition: service_healthy
      vite:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/up"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  vite:
    image: tarefy-vite:local
    build:
      context: .
      target: frontend
    working_dir: /app
    command: node docker/vite/dev.mjs
    environment:
      # 🎯 ALTERADO: mantém os horários exibidos pelo processo de desenvolvimento.
      TZ: "America/Sao_Paulo"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./resources:/source/resources:ro
      - tarefy-resources:/app/resources
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:5173/@vite/client"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  queue:
    <<: *app-service
    command: php artisan queue:work --verbose --tries=3 --timeout=90
    depends_on:
      app:
        condition: service_healthy

  scheduler:
    <<: *app-service
    command: php artisan schedule:work
    depends_on:
      app:
        condition: service_healthy

  db:
    image: mysql:8.4
    env_file:
      - .env.docker
    # 🎯 ALTERADO: o relógio do MySQL acompanha o horário de Brasília.
    environment:
      TZ: "America/Sao_Paulo"
    volumes:
      - tarefy-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

volumes:
  tarefy-mysql:
  tarefy-resources:
  tarefy-storage:
  tarefy-avatars:
